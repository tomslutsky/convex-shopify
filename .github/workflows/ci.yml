name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Shopify configuration
        run: npm run config:check --workspace shopify-convex-template
      - name: Generate Shopify API types
        run: npm run shopify:codegen --workspace shopify-convex-template
      - name: Build component package
        run: npm run build
      - name: Verify initializer package
        run: npm run verify:initializer
      - name: Run tests
        run: npm run test:all
      - name: Typecheck component and template
        run: npm run typecheck && npm run typecheck:example && npm run typecheck --workspace shopify-convex-template
      - name: Lint template
        run: npm run lint --workspace shopify-convex-template
      - name: Build production SPA
        run: npm run build --workspace shopify-convex-template
      - name: Check packed component
        run: npm run pack:check
      - name: Ensure generated artifacts are committed
        run: git diff --exit-code
