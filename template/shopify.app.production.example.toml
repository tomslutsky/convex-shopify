# Copy to the ignored `shopify.app.production.toml`, then link the named
# production configuration. Never commit the real client_id or URLs.
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "Shopify Convex Starter"
application_url = "https://example.invalid"
embedded = true

[access_scopes]
scopes = "read_products"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update"]
uri = "/webhooks/shopify"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/shopify"
